<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reschedule banner</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1300px; height: 360px; background: transparent; font-family: "Outfit", sans-serif; overflow: hidden; }
  body.preview { background: linear-gradient(100deg, #3a0ca3 0%, #5b21d6 45%, #7c3aed 80%, #a855f7 100%); }
  .abs { position: absolute; }
  img { display: block; }
  .shadow { box-shadow: 0 8px 18px rgba(30, 6, 80, .26), 0 2px 5px rgba(30, 6, 80, .12); }

  /* Notsi panel, rebuilt from the designed panel's own pieces (Recovery 2) */
  #panel { left: 626px; top: 10px; width: 220px; padding: 12px; background: #fff; border-radius: 18px; z-index: 3; }
  #panel img { width: 196px; }
  #msg { margin: 5px 0 7px; width: 180px; background: #f1ecfe; color: #1b2440; font-size: 9.2px; line-height: 1.38; padding: 6px 9px; border-radius: 10px; }

  /* Rearranged week (Recovery 3), cropped to Mon–Fri */
  #cal { left: 838px; top: 40px; width: 420px; background: #fff; border-radius: 18px; overflow: hidden; z-index: 1; }
  #cal img { width: 420px; }

  #toast { left: 986px; top: 300px; width: 178px; height: 30px; background: #1d1b2e; border-radius: 999px; overflow: hidden; z-index: 4; box-shadow: 0 8px 18px rgba(10, 6, 30, .35); }
  #toast img { width: 186px; margin: -2px 0 0 -4px; }

  #links { left: 0; top: 0; width: 1300px; height: 360px; z-index: 5; overflow: visible; pointer-events: none; }
</style>
</head>
<body>
  <div id="cal" class="abs shadow">
    <img src="assets/rs_cal_head.png" alt="">
    <img id="rows" src="assets/rs_cal_rows.png" alt="">
  </div>

  <div id="panel" class="abs shadow">
    <img src="assets/rs_head.png" alt="">
    <div id="msg">Hey John 👋 Monday and Tuesday got busy, and 2 sessions slipped. Totally normal.</div>
    <img id="slots" src="assets/rs_slots.png" alt="">
    <img src="assets/rs_btn.png" alt="" style="margin-top:7px">
  </div>

  <div id="toast" class="abs"><img src="assets/rs_toast.png" alt=""></div>

  <svg id="links" class="abs">
    <defs><marker id="dot" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6"><circle cx="4" cy="4" r="3.2" fill="#a855f7"/></marker></defs>
    <path id="l1" fill="none" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" marker-end="url(#dot)"/>
    <path id="l2" fill="none" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" marker-end="url(#dot)"/>
  </svg>

<script>
// Connect each suggested slot in the panel to the session it moved to on the calendar.
// Anchor points are measured on the 3x source crops (rs_slots.png / rs_cal_rows.png).
function pt(img, sx, sy, srcW) {
  const r = img.getBoundingClientRect(), k = r.width / srcW;
  return [r.left + sx * k, r.top + sy * k];
}
function link(id, a, b) {
  const [sx, sy] = a, [tx, ty] = b;
  const mx = (sx + tx) / 2, my = Math.min(sy, ty) - 26;
  document.getElementById(id).setAttribute("d", `M${sx},${sy} Q${mx},${my} ${tx},${ty}`);
}
window.addEventListener("load", () => {
  const slots = document.getElementById("slots"), rows = document.getElementById("rows");
  link("l1", pt(slots, 615, 308, 1151), pt(rows, 1098, 325, 1815));   // Thu 4:45 PM -> Math, Moved
  link("l2", pt(slots, 595, 629, 1151), pt(rows, 1466, 160, 1815));   // Fri 4:00 PM -> English, Moved
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
